<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enginy Call Map</title>
<meta name="description" content="Mapa interactivo y gamificado para que los SDR de Enginy preparen y ejecuten llamadas de cualificación (QCALL).">
<meta property="og:type" content="website">
<meta property="og:title" content="Enginy Call Map">
<meta property="og:description" content="Mapa interactivo y gamificado para que los SDR de Enginy preparen y ejecuten llamadas de cualificación (QCALL).">
<meta name="theme-color" content="#0B2A24">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23115548'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='40' font-weight='700' fill='%2336E471'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout: a quest path on top (6 nodes), a game board in the middle that changes per level (3D orbit of spheres, one-question-at-a-time cards, locks to open, mission-complete screen), and a HUD on the right with rank, XP, badges and loot. Dark-first, arcade-but-elegant, Enginy greens. */
:root{
  --bg:#06201B; --bg2:#0B2A24; --panel:rgba(16,54,46,.72); --panel-solid:#113A32; --panel2:rgba(255,255,255,.06); --fg:#EDF6F1; --muted:#9BBDB1;
  --line:rgba(237,246,241,.12); --brand:#115548; --accent:#36E471; --accent-ink:#06301A; --accent-soft:rgba(54,228,113,.16);
  --warn:#F5B547; --warn-ink:#2B1A00; --danger:#F07167; --gold:#FFD166;
  --sphere-a:#2A7A66; --sphere-b:#0F3B32; --glass:rgba(255,255,255,.07); --shadow:0 24px 60px rgba(0,0,0,.5);
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF5F1; --bg2:#F7FBF8; --panel:rgba(255,255,255,.8); --panel-solid:#FFFFFF; --panel2:rgba(17,85,72,.06); --fg:#0A2620; --muted:#4D6A61;
  --line:rgba(10,38,32,.12); --brand:#115548; --accent:#1C9A57; --accent-ink:#FFFFFF; --accent-soft:rgba(28,154,87,.14);
  --warn:#B9780A; --warn-ink:#FFFFFF; --danger:#C8433A; --gold:#B8860B; --sphere-a:#FFFFFF; --sphere-b:#CFE3DA; --glass:rgba(255,255,255,.65); --shadow:0 24px 60px rgba(10,38,32,.14); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#EEF5F1; --bg2:#F7FBF8; --panel:rgba(255,255,255,.8); --panel-solid:#FFFFFF; --panel2:rgba(17,85,72,.06); --fg:#0A2620; --muted:#4D6A61;
  --line:rgba(10,38,32,.12); --brand:#115548; --accent:#1C9A57; --accent-ink:#FFFFFF; --accent-soft:rgba(28,154,87,.14);
  --warn:#B9780A; --warn-ink:#FFFFFF; --danger:#C8433A; --gold:#B8860B; --sphere-a:#FFFFFF; --sphere-b:#CFE3DA; --glass:rgba(255,255,255,.65); --shadow:0 24px 60px rgba(10,38,32,.14); color-scheme:light; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
body::before{width:60vw;height:60vw;left:-15vw;top:-20vw;background:radial-gradient(circle,#1B6A58,transparent 65%);animation:drift 26s ease-in-out infinite alternate}
body::after{width:50vw;height:50vw;right:-18vw;bottom:-18vw;background:radial-gradient(circle,rgba(54,228,113,.35),transparent 65%);animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vw,6vw) scale(1.12)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg)}
.wrap{min-height:100%;display:flex;flex-direction:column;gap:16px;max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Quest path */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#1A6B59,#0E463B);display:grid;place-items:center;color:var(--accent);font-style:normal;font-family:var(--mono);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.25)}
.miles{display:grid;grid-template-columns:repeat(6,1fr);position:relative;min-width:0}
.miles::before{content:"";position:absolute;left:8.3%;right:8.3%;top:17px;height:3px;border-radius:2px;background:var(--line)}
.miles .fill{position:absolute;left:8.3%;top:17px;height:3px;border-radius:2px;background:linear-gradient(90deg,#1FB85B,var(--accent));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--accent)}
.mile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 4px;min-width:0;text-align:center}
.mile .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;background:var(--panel-solid);border:2px solid var(--line);color:var(--muted);transition:all .3s;position:relative;z-index:1;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25)}
.mile .lbl{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.mile .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mile.done .dot{background:linear-gradient(150deg,#5CF08E,#1FB85B);border-color:transparent;color:var(--accent-ink)}
.mile.done .lbl{color:var(--fg)}
.mile.on .dot{background:var(--brand);border-color:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--accent-soft),0 0 24px var(--accent-soft);transform:scale(1.12);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 10px var(--accent-soft),0 0 34px var(--accent-soft)}}
.mile.on .lbl{color:var(--fg)}
.mile.on .sub{color:var(--accent);opacity:1}
.mile:disabled{cursor:not-allowed}
.mile:not(:disabled):hover .dot{border-color:var(--accent)}
.reset{font-size:13px;color:var(--muted);padding:8px 12px;border-radius:10px;white-space:nowrap}
.reset:hover{color:var(--fg);background:var(--panel2)}
@media (max-width:520px){.mile:not(.on) .lbl{display:none}.mile.on .lbl{overflow:visible}}
@media (max-width:900px){.rail{grid-template-columns:1fr auto}.logo{display:none}.mile .sub{display:none}.mile .lbl{font-size:10.5px}.mile .dot{width:30px;height:30px;font-size:12px}}

/* Board */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1000px){.main{grid-template-columns:1fr}}
.stage{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:26px;min-width:0;position:relative;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 100px);animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.stage h1{font-size:clamp(24px,2.8vw,34px);line-height:1.08;margin:0 0 8px;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:66ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .tag{background:var(--accent-soft);padding:3px 8px;border-radius:6px;color:var(--fg);letter-spacing:.06em}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px;flex-wrap:wrap}
.foot .count{margin-right:auto;color:var(--muted);font-size:13px}
.btn{padding:11px 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(150deg,#5CF08E,#22BD60);color:#06301A;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px rgba(54,228,113,.3)}
.btn.warn{background:linear-gradient(150deg,#FFD07A,#E09A1A);color:#2B1A00;border-color:transparent}
.btn.ghost{color:var(--muted);background:none}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
kbd{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}

/* Orbit map (levels 1 & 3) */
.map{position:relative;width:100%;max-width:680px;aspect-ratio:1;margin:0 auto;perspective:1200px}
.map .ring{position:absolute;border-radius:50%;border:1px solid var(--line);inset:6%;pointer-events:none;background:radial-gradient(circle,transparent 60%,var(--panel2));animation:spin 90s linear infinite}
.map .ring.r2{inset:28%;border-style:dashed;animation-direction:reverse;animation-duration:60s}
@keyframes spin{to{transform:rotate(360deg)}}
.sphere{position:absolute;left:50%;top:50%;width:var(--d,126px);height:var(--d,126px);margin:calc(var(--d,126px)/-2) 0 0 calc(var(--d,126px)/-2);border-radius:50%;
  transform:translate(var(--x,0),var(--y,0)) translateZ(0);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
  color:var(--fg);font-size:13px;line-height:1.2;font-weight:600;letter-spacing:-.01em;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.34),rgba(255,255,255,0) 38%),radial-gradient(circle at 68% 78%,rgba(0,0,0,.38),rgba(0,0,0,0) 55%),linear-gradient(150deg,var(--sphere-a),var(--sphere-b));
  box-shadow:inset 0 -14px 26px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.25),0 18px 34px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  transition:transform .55s cubic-bezier(.2,.8,.2,1),width .45s,height .45s,margin .45s,opacity .4s,box-shadow .25s,filter .25s;will-change:transform}
.sphere::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);pointer-events:none}
.sphere.float{animation:bob 6s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes bob{50%{margin-top:calc(var(--d,126px)/-2 - 3px)}}
.sphere:hover,.sphere:focus-visible{transform:translate(var(--x,0),var(--y,0)) translateY(-6px) scale(1.06);filter:brightness(1.12);box-shadow:inset 0 -14px 26px rgba(0,0,0,.28),inset 0 2px 2px rgba(255,255,255,.3),0 28px 46px rgba(0,0,0,.42),0 0 0 4px var(--accent-soft);z-index:3}
.sphere .code{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--accent);letter-spacing:.08em;display:block;margin-bottom:3px}
.sphere .t{display:block}
.sphere .hint{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:5px;font-style:italic;line-height:1.25}
.sphere.persona em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-top:4px}
.sphere.core{--d:172px;cursor:default;font-size:15px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.28),rgba(255,255,255,0) 40%),radial-gradient(circle at 68% 78%,rgba(0,0,0,.45),rgba(0,0,0,0) 55%),linear-gradient(150deg,#1C6E5B,#0A3A30);color:#EDF6F1;
  box-shadow:inset 0 -18px 30px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.25),0 0 0 12px var(--accent-soft),0 0 60px rgba(54,228,113,.25),0 26px 50px rgba(0,0,0,.45);z-index:2}
.sphere.core::before{content:"";position:absolute;inset:-22px;border-radius:50%;border:1px solid var(--accent);opacity:.35;animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.sphere.core small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.sphere.core:hover{transform:translate(0,0);filter:none}
.sphere.pain{--d:136px;font-weight:600;font-size:12.5px}
.sphere.pain.sel{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),radial-gradient(circle at 68% 78%,rgba(0,0,0,.25),rgba(0,0,0,0) 55%),linear-gradient(150deg,#5CF08E,#1FB85B);color:#06301A;box-shadow:inset 0 -14px 26px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.5),0 18px 34px rgba(0,0,0,.35),0 0 30px rgba(54,228,113,.45)}
.sphere.pain.sel .code,.sphere.pain.sel .hint{color:#06301A;opacity:.75}
.sphere.pain.partner{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.3),rgba(255,255,255,0) 38%),radial-gradient(circle at 68% 78%,rgba(0,0,0,.38),rgba(0,0,0,0) 55%),linear-gradient(150deg,#8A6A2A,#4A3610)}
.sphere.pain.partner .code{color:var(--warn)}
.sphere.pain.partner.sel{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),linear-gradient(150deg,#FFD07A,#E09A1A);color:#2B1A00;box-shadow:0 18px 34px rgba(0,0,0,.35),0 0 30px rgba(245,181,71,.45)}
.sphere.pain.partner.sel .code,.sphere.pain.partner.sel .hint{color:#2B1A00}
.sphere.out{opacity:0;transform:translate(var(--x,0),var(--y,0)) scale(.4);pointer-events:none}
.sphere.born{transform:translate(0,0) scale(.2);opacity:0}
.sphere .tick{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:#06301A;color:var(--accent);display:grid;place-items:center;font-size:12px}
.sphere.partner .tick{background:#2B1A00;color:var(--warn)}
.tip{position:absolute;z-index:6;width:280px;max-width:90%;background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;font-size:13px}
.tip.show{opacity:1;transform:none}
.tip .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tip p{margin:0 0 6px;font-style:italic;line-height:1.35}
.tip p:last-child{margin:0}
.tip .role{font-style:normal;color:var(--muted)}
@media (max-width:720px){
  .map{aspect-ratio:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;perspective:none}
  .map .ring{display:none}
  .tip{position:fixed;left:16px!important;right:16px;bottom:16px;top:auto!important;width:auto;max-width:none}
  .sphere{position:static;margin:0;width:auto;height:auto;min-height:104px;border-radius:20px;transform:none!important;animation:none!important}
  .sphere.core{grid-column:1/-1;min-height:78px}
  .sphere.core::before{display:none}
}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:6px}
.pcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.pcard.sel{border-color:var(--accent);background:var(--accent-soft)}
.pcard.partner{border-style:dashed;border-color:var(--warn)}
.pcard .code{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.08em}
.pcard .t{font-weight:700;font-size:15px;letter-spacing:-.01em}
.pcard .say{color:var(--muted);font-size:12.5px;font-style:italic}
.pcard .q{font-size:13px;margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.pcard .q b{font-family:var(--mono);font-weight:500;font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset -2px -2px 4px rgba(0,0,0,.3)}

/* Drawer (pain detail) */
.drawer{position:absolute;inset:0;background:var(--panel-solid);transform:translateX(104%);transition:transform .36s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:26px;display:flex;flex-direction:column;gap:16px;z-index:4}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:flex-start;gap:12px}
.drawer header .code{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em}
.drawer header h2{margin:2px 0 0;font-size:24px;letter-spacing:-.02em;line-height:1.12}
.drawer header .say{color:var(--muted);font-style:italic;margin-top:5px}
.drawer .back{margin-left:auto;font-size:13px;color:var(--muted);padding:7px 11px;border-radius:9px;white-space:nowrap}
.drawer .back:hover{background:var(--panel2);color:var(--fg)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card ol,.card ul{margin:0;padding-left:18px}
.card li{margin:6px 0}
.card li.q{font-style:italic}
.card.impact{border-left:3px solid var(--danger)}
.card.partner{border-left:3px solid var(--warn)}
.card p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:7px;background:var(--brand);color:#EDF6F1;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto}

/* Shields (ICP criteria) */
.shields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media (max-width:640px){.shields{grid-template-columns:repeat(2,1fr)}}
.shield{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .35s}
.shield .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--panel-solid);border:1px solid var(--line);font-size:20px;filter:grayscale(1) opacity(.5);transition:all .35s;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25)}
.shield b{font-size:12.5px;line-height:1.2}
.shield small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.shield.ok{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft),0 0 30px rgba(54,228,113,.25)}
.shield.ok .ico{filter:none;background:linear-gradient(150deg,#5CF08E,#1FB85B);border-color:transparent;transform:scale(1.08);animation:popin .5s cubic-bezier(.2,1.4,.3,1)}
.shield.ko{border-color:var(--danger);background:rgba(240,113,103,.1)}
.shield.ko .ico{filter:none;background:linear-gradient(150deg,#F79B94,#C8433A);border-color:transparent}
@keyframes popin{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1.08)}}

/* Card deck (one question at a time) */
.deck{max-width:720px;margin:0 auto;position:relative}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .3s;cursor:pointer}
.dots i.done{background:var(--accent)}
.dots i.on{background:var(--fg);transform:scale(1.4);box-shadow:0 0 10px var(--accent)}
.dots i.skip{background:var(--warn);opacity:.6}
.qcardbig{background:linear-gradient(160deg,var(--panel-solid),var(--bg2));border:1px solid var(--line);border-radius:24px;padding:28px 30px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);animation:deal .4s cubic-bezier(.2,.8,.2,1);min-height:280px;display:flex;flex-direction:column;gap:14px;position:relative}
.qcardbig::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(140deg,var(--accent),transparent 40%,transparent 60%,var(--accent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;pointer-events:none}
@keyframes deal{from{opacity:0;transform:translateX(40px) rotate(1.5deg)}}
.qcardbig .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:10px}
.qcardbig .k .xp{color:var(--gold)}
.qcardbig .ask{font-size:clamp(19px,2.3vw,25px);font-weight:700;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.qcardbig .why{color:var(--muted);font-size:13.5px;margin-top:-6px}
.qcardbig .in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qcardbig input[type=text]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:14px 16px;font:16px var(--sans)}
.qcardbig input::placeholder{color:var(--muted);opacity:.65;font-family:var(--mono);font-size:13px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{padding:14px 22px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;transition:all .15s;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18)}
.opt:hover{transform:translateY(-2px);border-color:var(--accent)}
.opt.on{background:linear-gradient(150deg,#5CF08E,#22BD60);color:#06301A;border-color:transparent}
.opt.no.on{background:linear-gradient(150deg,#F79B94,#C8433A);color:#fff}
.qcardbig .nav{display:flex;gap:10px;align-items:center;margin-top:auto;flex-wrap:wrap}
.qcardbig .nav .sp{margin-left:auto;color:var(--muted);font-size:12.5px}
.answered{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center}
.answered button{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.answered button b{color:var(--fg);font-weight:500}
.answered button:hover{border-color:var(--accent);color:var(--fg)}
.verdict{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 20px;border-radius:20px;border:1px solid var(--line);background:var(--panel2)}
.verdict b{display:block;font-size:18px;letter-spacing:-.01em}
.verdict span{color:var(--muted);font-size:13.5px}
.verdict.yes{border-color:var(--accent);background:var(--accent-soft)}
.verdict.no{border-color:var(--danger);background:rgba(240,113,103,.1)}

/* Quantify: boss cards */
.bosses{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.boss{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.boss .hp{width:46px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.boss .hp i{display:block;height:100%;background:linear-gradient(90deg,#1FB85B,#5CF08E);transition:width .3s}
.boss.on{border-color:var(--accent);background:var(--accent-soft)}
.boss.full{border-color:var(--gold)}
.bossbody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.bossbody{grid-template-columns:1fr}}
.qrow{display:grid;gap:5px;padding:10px 0;border-top:1px solid var(--line)}
.qrow .q{font-size:14px;font-style:italic}
.qrow input{width:100%;border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:10px 12px;font:13.5px var(--mono);transition:box-shadow .2s}
.qrow input.hit{box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent)}
.qrow input::placeholder{color:var(--muted);opacity:.65}
.why-row{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:8px;border-top:0}
.why-row .q b{font-style:normal;color:var(--accent)}
.side h4{margin:0 0 6px;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.side p{margin:0 0 12px;font-size:13.5px}
.side .frame{background:var(--panel-solid);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.side .frame b{display:block;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}

/* Mapear: locks */
.locks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.lock{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:18px 14px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .3s;cursor:pointer}
.lock:hover{transform:translateY(-3px);border-color:var(--accent)}
.lock .ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--panel-solid);border:2px solid var(--line);box-shadow:inset 0 -8px 14px rgba(0,0,0,.3);transition:all .35s}
.lock b{font-size:13px;line-height:1.2}
.lock small{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lock .ring{position:absolute;inset:0;border-radius:20px;pointer-events:none}
.lock.on{border-color:var(--accent);background:var(--accent-soft)}
.lock.open .ico{background:linear-gradient(150deg,#5CF08E,#1FB85B);border-color:transparent;transform:rotate(-8deg) scale(1.08);animation:unlock .6s cubic-bezier(.2,1.4,.3,1)}
.lock.open{border-color:var(--accent)}
.lock.open::after{content:"✓";position:absolute;top:10px;right:12px;font-family:var(--mono);color:var(--accent);font-weight:600}
@keyframes unlock{0%{transform:rotate(0) scale(.8)}50%{transform:rotate(-20deg) scale(1.25)}100%{transform:rotate(-8deg) scale(1.08)}}
.challenge{background:linear-gradient(160deg,var(--panel-solid),var(--bg2));border:1px solid var(--accent);border-radius:24px;padding:24px 26px;box-shadow:var(--shadow);animation:deal .35s cubic-bezier(.2,.8,.2,1)}
.challenge h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.challenge .goal{color:var(--muted);margin:0 0 14px;font-size:14px}
.qchips{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.qchip{text-align:left;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:14px;line-height:1.35;transition:all .15s}
.qchip:hover{border-color:var(--accent);transform:translateX(3px)}
.qchip .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent-ink);margin-top:1px;transition:all .2s}
.qchip.on{border-color:var(--accent);background:var(--accent-soft)}
.qchip.on .box{background:var(--accent);border-color:var(--accent)}
.qchip.extra{border-style:dashed}
.qchip.extra .plus{font-family:var(--mono);color:var(--accent);margin-right:4px}
.challenge .ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.challenge .ans input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:13px 15px;font:15px var(--sans)}
.challenge .flag{margin:10px 0 0;font-size:12.5px;color:var(--warn);font-family:var(--mono);line-height:1.4}

/* Close: mission complete */
.mission{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center;margin-bottom:18px}
@media (max-width:700px){.mission{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ringwrap{position:relative;width:200px;height:200px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .num b{font-size:44px;letter-spacing:-.04em;line-height:1;font-family:var(--mono);font-weight:600}
.ringwrap .num small{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rank{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:linear-gradient(150deg,#FFD166,#E09A1A);color:#2B1A00;font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:0 8px 20px rgba(255,209,102,.3)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:12px;line-height:1.2;opacity:.45;filter:grayscale(1)}
.badge .b{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--panel-solid);font-size:16px;flex:none;box-shadow:inset 0 -5px 8px rgba(0,0,0,.25)}
.badge.on{opacity:1;filter:none;border-color:var(--gold);background:rgba(255,209,102,.1)}
.badge.on .b{background:linear-gradient(150deg,#FFD166,#E09A1A)}
.badge small{display:block;color:var(--muted);font-family:var(--mono);font-size:10px;margin-top:2px}
.script{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.script h3{margin:0 0 8px;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.script p{margin:8px 0;font-size:15.5px;line-height:1.5}
.script p mark{background:var(--accent-soft);color:var(--fg);padding:0 4px;border-radius:4px}
.script p mark.miss{background:rgba(240,113,103,.18);font-family:var(--mono);font-size:13px}
.missbox{margin-top:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--warn);background:rgba(245,181,71,.1);font-size:13.5px;line-height:1.5}
.missbox b{display:block;margin-bottom:2px}
.missbox.ok{border-color:var(--accent);background:var(--accent-soft)}
.missbox .btn{padding:7px 12px;font-size:12.5px}
textarea.sum{width:100%;min-height:340px;resize:vertical;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--fg);padding:14px;font:13px/1.5 var(--mono)}

/* HUD */
.sheet{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
@media (max-width:1000px){.sheet{position:static}}
.sheet h2{margin:0;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hud{display:flex;gap:14px;align-items:center}
.lvl{width:64px;height:64px;border-radius:50%;position:relative;flex:none}
.lvl svg{width:100%;height:100%;transform:rotate(-90deg)}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:15px;font-weight:600}
.hud .t{min-width:0}
.hud .t b{display:block;font-size:15px;letter-spacing:-.01em}
.hud .t small{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-top:2px}
.xpbar{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#1FB85B,#5CF08E,#FFD166);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--accent)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:7px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;background:var(--accent-soft);color:var(--fg);margin:2px 4px 2px 0}
.pill.w{background:rgba(245,181,71,.22)}
.pill.ok{background:var(--accent);color:var(--accent-ink)}
.sheet textarea{width:100%;min-height:110px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--fg);padding:10px;font:13px/1.45 var(--mono)}
.toast{font-size:12px;color:var(--accent);font-family:var(--mono);min-height:16px}
.empty{color:var(--muted);font-size:13px}
.loot{font-size:12px;font-family:var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto}
.loot b{color:var(--fg);font-weight:500}
.badges.mini{grid-template-columns:repeat(4,1fr)}
.badges.mini .badge{padding:6px;justify-content:center}
.badges.mini .badge span{display:none}
/* XP pop */
.pop{position:fixed;z-index:60;font-family:var(--mono);font-weight:600;font-size:15px;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function fitCrit(){const c=S.co;const reps=num(c.reps),emp=num(c.employees);

const CORE=["reps","employees","outbound","process","icpDigital"];
function xp(){let x=0;const c=S.co;
  CORE.forEach(k=>{if(c[k])x+=4});                                   // 20 · escudos
  ["contact","icpPersona"].forEach(k=>{if(c[k])x+=2});if(c.ai)x+=1;  // 5
  CO_CARDS.filter(k=>k.loot).forEach(k=>{if(c[k.k])x+=1});          // 16 · loot empresa
  x+=Math.min(3,S.pains.length)*3;                                    // 9 · pains
  x+=Math.min(9,ansCount());                                          // 9 · datos
  x+=Math.min(3,Object.values(S.why).filter(Boolean).length)*2;      // 6 · porqués
  x+=Object.values(S.base).filter(Boolean).length;                   // 8 · métricas base
  if(partnerPath()){if(S.qnotes.partner)x+=9;if(S.qnotes.review)x+=9;x+=Math.min(9,Object.keys(S.checks).filter(k=>/^p\d$/.test(k)&&S.checks[k]).length*1.3)}

const fx=$("#fx"),ctx=fx.getContext("2d");let parts=[];

function burst(x,y,n){const cols=["#36E471","#5CF08E","#FFD166","#EDF6F1","#1FB85B"];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.25,l:60+Math.random()*30,c:cols[i%cols.length],s:3+Math.random()*4,r:Math.random()*Math.PI})}if(parts.length===n)tick()}
function tick(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.l--;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,p.l/25);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});if(parts.length)requestAnimationFrame(tick)}

    if(!S._celebrated){S._celebrated=1;save();burst(innerWidth/2,200,120)}},0);
  return `<div class="eyebrow">Nivel 6 · ${pp?"Derivar":"Cerrar"} <span class="tag">${esc(p.name)}</span> <span class="tag">${esc(fitLabel())}</span></div><h1>${pp?"Misión: derivar a Partner":x>=100?"Quali completada":"Fin de la llamada"}</h1>
  <div class="mission"><div class="ringwrap"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/><defs><linearGradient id="g"><stop offset="0" stop-color="#1FB85B"/><stop offset="1" stop-color="#FFD166"/></linearGradient></defs></svg><div class="num"><b>${x}%</b><small>progreso</small></div></div>
    <div><span class="rank">★ ${r[1]}</span><p style="margin:10px 0 12px;color:var(--muted)">${nr?`Progreso ${x}%: te faltan ${nr[0]-x} punto${nr[0]-x===1?"":"s"} para “${nr[1]}”. `:"Progreso 100%. "}${pp?"Derivación bien hecha: deja la cuenta lista para revisar.":"Pide la demo con el decisor usando el script; luego copia la nota al deal."}</p>
    <div class="badges">${BADGES.map(b=>`<div class="badge ${b[4]()?"on":""}"><div class="b">${b[1]}</div><div><span>${esc(b[2])}</span><small>${esc(b[3])}</small></div></div>`).join("")}</div></div></div>
  <div class="script"><h3>Script de cierre</h3>
  ${pp?`<p>“Os lo digo con transparencia: Enginy funciona cuando ya hay un equipo prospectando cada día. Hoy os haría perder dinero. Lo que sí os ayuda es montar el proceso y la primera contratación, y para eso os presento a <mark class="${S.qnotes.partner?"":"miss"}">${esc(S.qnotes.partner||"[Partner]")}</mark>. Cuando tengáis a esa persona, volvemos a hablar.”</p>`
  :`${main.map(i=>`<p>“${fill(PAINS[i].frame,i)}”</p>`).join("")}
  <p>“Lo que hacemos con equipos como el vuestro es exactamente eso: <mark>${esc(uniqProducts().slice(0,3).map(s=>s.split(" (")[0]).join(", "))}</mark>, en una sola plataforma.”</p>
  <p>“Te propongo una demo de 30 minutos con vuestros datos: construimos una lista de vuestro ICP en directo y ves el mensaje que saldría. Para no hacer dos rondas, ¿incluimos a <mark>${esc(S.qnotes.process||p.dm)}</mark>? ¿Jueves o viernes te va mejor?”</p>`}
  </div>
  ${miss.length?`<div class="missbox"><b>${miss.length} campos de la nota sin respuesta.</b> Si aún estás en la call, pregúntalos ahora: ${miss.slice(0,8).map(esc).join(" · ")}${miss.length>8?" · …":""} <span class="row" style="margin-top:8px"><button class="btn ghost jump" data-s="2">Ir a Empresa</button><button class="btn ghost jump" data-s="4">Ir a Cuantificar</button><button class="btn ghost jump" data-s="5">Ir a Mapear</button></span></div>`:`<div class="missbox ok"><b>Nota completa.</b> Todos los campos tienen respuesta.</div>`}
  <div class="eyebrow" style="margin-top:14px">Nota de la QCALL · pegar en el deal de HubSpot</div>
  <textarea class="sum" id="sum"></textarea>
  <div class="foot"><span class="toast" id="toast"></span><button class="btn ghost" id="back">← Mapear</button><button class="btn ghost" id="again">Nueva partida</button><button class="btn primary" id="copy">Copiar nota</button></div>`;
}
const YN=v=>v==="yes"?"Yes":v==="no"?"No":"—";
const V=v=>(v||"").trim()||"—";
function qcallText(){
  const p=persona(); if(!p) return ""; const c=S.co,q=S.qnotes,b=S.base,pp=partnerPath();
  const d=new Date(),date=`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getFullYear()).slice(2)}`;
  const crit=fitCrit().map(x=>`${x.v===true?"✓":x.v===false?"✗":"?"} ${x.t}`).join(" · ");
  const keywords=[...S.pains.map(i=>S.why[i]).filter(Boolean),S.quick].filter(Boolean);
  const painsBlock=S.pains.length?S.pains.map(i=>{const x=PAINS[i],a=S.answers[i]||[];const lines=[`• ${i} · ${x.t} — "${x.say}"`];x.quant.forEach((qq,k)=>{if(a[k])lines.push(`   - ${qq[0]}: ${a[k]}`)});lines.push(`   - Why (in their words): ${V(S.why[i])}`);return lines.join("\n")}).join("\n"):"• —";
  const L=[`QCALL - ${date}`,
`ICP-FIT: ${fitVerdict()==="no"?"NO → Partner referral":pp?"NO (pain "+S.pains.filter(i=>PAINS[i].partner).join(", ")+") → Partner referral":fitVerdict()==="yes"?"YES":"PENDING"} (${crit})`,
`Who are we meeting with? (Recommended: CSO, COO, CEO, CRO, CMO)`,``,`* ${V(c.contact)} (${p.name})`,``,
`Have they done / Are they doing outbound?`,``,`* ${YN(c.outbound)}${c.process?` · defined process: ${YN(c.process)}`:""}`,``,
`Are they using any AI for prospecting (Claude, Chat GPT...)?`,``,`* ${YN(c.ai)}${c.aiTool?` · ${c.aiTool}`:""}`,``,
`Key words/sentences (filled manual):`,``,`* ${keywords.length?keywords.join("\n* "):"—"}`,``,
`A) COMPANY SITUATION`,`• Location: ${V(c.location)}`,``,`• Business Lines: ${V(c.business)}`,``,`• No. of employees / No. of sales reps / Team structure: ${V(c.employees)} / ${V(c.reps)} / ${V(c.structure)}`,``,
`B) Client's ICP`,`• Countries: ${V(c.icpCountries)}`,``,`• Industries / Sectors: ${V(c.icpIndustries)}`,``,`• Company Size & Revenue: ${V(c.icpSize)}`,``,`• Buyer Persona: ${V(c.icpPersona)}`,``,`• Is your target persona on LinkedIn?`,`${YN(c.icpDigital)}`,
`C) LEAD LIST GENERATION & ENRICHMENT PROCESS`,`OPEN QUESTION (WHAT is the process, HOW they use the tools, WHO is in charge of the Lead Generation, HOW MUCH time spent): ${V(c.processOpen)}`,
`• C.1) CRM: ${V(c.crm)}`,`• C.2) AI Tool: ${c.ai==="no"?"No":V(c.aiTool)}`,`• C.3) List Building Tools/Data Enrichment Tools: ${V(c.listTools)}`,`• C.4) Campaigns/Sequence Tool: ${V(c.seqTool)}`,`• C.5) Sales Navigator Licenses? ${V(c.salesNav)}`,
`• C.6) "What type of information that you can't find in LinkedIn can be important to find your potential client?": ${V(c.extraInfo)}`,
`• Ask for emails quality: ${V(b.emailQuality)}`,`• Ask for Email Bounce Rate: ${V(b.bounce||(S.answers.B2||[])[0])}`,`• Ask for reply rate: ${V(b.reply)}`,`• Ask for phone number quality: ${V(b.phoneQuality)}`,
`D) WHAT DOES A SALES REP'S DAY-TO-DAY LOOK LIKE`,`OPEN QUESTION (TASKS that an Sales Rep. carries out daily and HOW MUCH TIME spend & potential inefficiencies): ${V(c.dayOpen)}`,`Outreach - Prospecting channels (CURRENTLY):`,``,
`* Cold Call: ${c.coldCall==="no"?"NO":c.coldCall?"YES → "+(c.coldCall==="mobile"?"MOBILE":"OFFICE"):"—"}`,`* Email: ${c.chEmail?YN(c.chEmail).toUpperCase():"—"}`,`* LinkedIn: ${c.chLinkedin?YN(c.chLinkedin).toUpperCase():"—"}`,``,
`E) VOLUME & RATIOS`,`• HOW MANY COMPANIES are your SDRs contacting per month (week/day)? ${V(b.companiesMonth)}`,``,`• Sales Cycle Average Duration: ${V(b.cycle)}`,``,`• Average ticket per client (MRR/Annual/one-off): ${V(b.ticket)}`,``,`• Current number of clients: ${V(b.clients)}`,``,
`F) PAINS (WHAT pains are they facing and WHY, MANUALLY)`,painsBlock,
`G) IMPACT (ROI of Using Enginy, based on their metrics):`,``,`* ${V(q.impact)}${S.pains.length&&!pp?`\n* Positioning: ${uniqProducts().map(s=>s.split(" (")[0]).join(", ")}`:""}`,``,
`H) COMPETITORS (are they currently looking at other solutions? Which ones?)`,``,`* ${V(q.competitors)}`,``,
`I) TIMING (when would they start the implementation?)`,``,`* ${V(q.timing)}`,``,
`J) Decision Criteria (what are they key points you evaluate to make a decision?)`,``,`* ${V(q.criteria)}`,``,
`K) Decision Process (What are the STEPS and PEOPLE involved in the decision?)`,``,`* ${V(q.process)}${!pp&&!q.process?`\n* Expected decision maker: ${p.dm}`:""}`,``,
`L) Price and payment terms:`,`• Did you mention price? (${YN(q.priceMentioned).toUpperCase()})`,`• Did you mention payment model? (${YN(q.paymentMentioned).toUpperCase()})`,q.price?`• Notes: ${q.price}`:""];
  if(pp) L.push(``,`→ NEXT STEP: Partner referral · Partner: ${V(q.partner)} · Review: ${q.review||(S.pains.includes("P2")?"6-9 months":"6 months")}`);
  else L.push(``,`→ NEXT STEP: demo [date] with ${q.process||p.dm}`);
  L.push(``,`— Progreso de la quali: ${xp()}% · ${rank(xp())[1]}`);
  return L.filter(x=>x!==undefined).join("\n");
}
function copy(t,tid){(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copiado al portapapeles",tid)).catch(()=>{const ta=$("#sum");if(ta){ta.focus();ta.select()}toast("Selecciona y copia (Ctrl/⌘+C)",tid)})}
function toast(m,id){const t=$("#"+(id||"ntoast"));if(t){t.textContent=m;setTimeout(()=>{if(t.textContent===m)t.textContent=""},2200)}}

// ---- HUD ----
function renderSheet(){
  const p=persona(),pp=partnerPath(),x=xp(),r=rank(x),nr=nextRank(x),prev=r[0],span=nr?nr[0]-prev:1,prog=nr?Math.round(100*(x-prev)/span):100;
  const C=2*Math.PI*27;const pctAll=x;
  const nums=[];S.pains.forEach(i=>(S.answers[i]||[]).forEach((a,k)=>{if(a)nums.push([i,PAINS[i].quant[k][0],a])}));BASE_CARDS.forEach(b=>{if(S.base[b.k])nums.push(["Base",BLBL[b.k],S.base[b.k]])});
  $("#sheet").innerHTML=`<h2>Progreso de la quali</h2>
  <div class="hud"><div class="lvl"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pctAll/100)}" style="transition:stroke-dashoffset .5s"/></svg><b>${x}</b></div>
    <div class="t"><b>${r[1]}</b><small>Progreso ${x}%${nr?` · ${nr[0]-x} para “${nr[1]}”`:""}</small><div class="xpbar" style="margin-top:6px"><i style="width:${x}%"></i></div></div></div>
  <dl class="kv"><dt>Perfil</dt><dd>${p?esc(p.name):'<span class="empty">sin elegir</span>'}</dd>
  <dt>ICP-fit</dt><dd>${p?`<span class="pill ${fitVerdict()==="yes"?"ok":fitVerdict()==="no"?"w":""}">${esc(fitLabel())}</span>`:'<span class="empty">—</span>'}</dd>
  <dt>Pains</dt><dd>${S.pains.length?S.pains.map(i=>`<span class="pill ${PAINS[i].partner?"w":""}" title="${esc(PAINS[i].t)}">${i}</span>`).join(""):'<span class="empty">ninguno todavía</span>'}</dd>
  <dt>Ruta</dt><dd>${!S.pains.length&&!pp?'<span class="empty">—</span>':(pp?'<span class="pill w">Partner referral</span>':'<span class="pill ok">Demo con decisor</span>')}</dd>
  <dt>Decisor</dt><dd style="font-size:13px">${p?esc(S.qnotes.process||p.dm):'<span class="empty">—</span>'}</dd></dl>
  <div><div style="font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Insignias</div><div class="badges mini">${BADGES.map(b=>`<div class="badge ${b[4]()?"on":""}" title="${esc(b[2])} · ${esc(b[3])}"><div class="b">${b[1]}</div><span></span></div>`).join("")}</div></div>
  ${nums.length?`<div><div style="font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Loot · ${nums.length}</div><div class="loot">${nums.slice(-10).reverse().map(n=>`<span>${n[0]} · ${esc(n[1]).slice(0,28)}: <b>${esc(n[2])}</b></span>`).join("")}</div></div>`:""}
  <div><div style="font-size:12px;color:var(--muted);margin-bottom:5px">Notas rápidas</div><textarea id="quick" placeholder="Objeciones, nombres, contexto…">${esc(S.quick)}</textarea></div>
  <div class="row"><button class="btn ghost" id="ncopy" style="font-size:13px;padding:8px 12px">Copiar nota</button><span class="toast" id="ntoast"></span></div>`;
  $("#quick").oninput=e=>{S.quick=e.target.value;save()};
  $("#ncopy").onclick=()=>{if(!p)return toast("Elige primero un perfil");copy(qcallText())};
}
function resetAll(){S={step:1,persona:null,pains:[],detail:null,view:S.view,checks:{},answers:{},why:{},qnotes:{},base:{},co:{},quick:"",ci:0,bi:0,boss:0,lock:null,skipped:{}};lastXp=0;render()}
$("#reset").onclick=resetAll;
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{const m=$("#map");if(m)placeSpheres(m,$$(".sphere:not(.core)"))},150)});
lastXp=xp();render();
</script>
